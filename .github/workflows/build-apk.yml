name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Plays every game at every age group in headless Chrome and stops the build on any JavaScript error,
      # so a broken app is never published. Also writes voice-lines.json (every line the app says),
      # which the Colab voice maker downloads from the release.
      - name: Test the games in Chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund puppeteer-core@24
          node tools/smoke.mjs

      # One test key for every build, so a new APK installs over the old one.
      # The first run creates it and keeps it on a pre-release named "signing-key".
      - name: Get or create the test signing key
        run: |
          if gh release download signing-key --pattern tuldok-test.keystore --dir app; then
            echo "Using the saved test key."
          else
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore app/tuldok-test.keystore -alias tuldok \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tuldok-test -keypass tuldok-test \
              -dname "CN=Tuldok Test, O=Tuldok, C=PH"
            gh release create signing-key app/tuldok-test.keystore \
              --prerelease --target "$GITHUB_SHA" \
              --title "Test signing key (not for production)" \
              --notes "Created by the build so new test APKs install over old ones."
          fi

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: cp app/build/outputs/apk/release/app-release.apk tuldok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tuldok-apk
          path: tuldok.apk

      # Same download links every time: /releases/download/latest-build/tuldok.apk (and voice-lines.json)
      - name: Publish to Releases
        run: |
          FILES="tuldok.apk"
          if [ -f voice-lines.json ]; then FILES="$FILES voice-lines.json"; fi
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build $FILES \
            --target "$GITHUB_SHA" --latest \
            --title "Tuldok build ${GITHUB_RUN_NUMBER}" \
            --notes "Version 0.1.${GITHUB_RUN_NUMBER}, built from ${GITHUB_SHA::7}. Download tuldok.apk on your phone or tablet and install it. voice-lines.json lists every line the app says, for the Colab voice maker."
