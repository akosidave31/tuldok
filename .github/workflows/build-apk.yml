name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # One test key for every build, so a new APK installs over the old one.
      # The first run creates it and keeps it on a pre-release named "signing-key".
      - name: Get or create the test signing key
        run: |
          if gh release download signing-key --pattern tuldok-test.keystore --dir app; then
            echo "Using the saved test key."
          else
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore app/tuldok-test.keystore -alias tuldok \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tuldok-test -keypass tuldok-test \
              -dname "CN=Tuldok Test, O=Tuldok, C=PH"
            gh release create signing-key app/tuldok-test.keystore \
              --prerelease --target "$GITHUB_SHA" \
              --title "Test signing key (not for production)" \
              --notes "Created by the build so new test APKs install over old ones."
          fi

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: cp app/build/outputs/apk/release/app-release.apk tuldok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tuldok-apk
          path: tuldok.apk

      # Same download link every time: /releases/latest/download/tuldok.apk
      - name: Publish to Releases
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build tuldok.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Tuldok build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Download tuldok.apk on your phone or tablet and install it."
