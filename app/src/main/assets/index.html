<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuldok Worksheet Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&amp;family=Fredoka:wght@500;600;700&amp;display=swap">
<style>
:root {
  /* Layout idea: a settings rail beside a live paper preview; on phones the rail stacks above the preview and Download stays pinned at the bottom. */
  --paper: #f5f7f4;
  --card: #ffffff;
  --ink: #1c2a33;
  --muted: #566672;
  --line: #d6dfe6;
  --rule: #9bbfe6;
  --go: #17834a;
  --go-soft: #e3f2e9;
  --on-go: #ffffff;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151a; --card: #172028; --ink: #e4ecf1; --muted: #9db0bd; --line: #293641;
    --rule: #41689a; --go: #45c480; --go-soft: #15302a; --on-go: #0a1810;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151a; --card: #172028; --ink: #e4ecf1; --muted: #9db0bd; --line: #293641;
  --rule: #41689a; --go: #45c480; --go-soft: #15302a; --on-go: #0a1810;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rule) 22%, transparent) 31px 32px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
h1, h2 { text-wrap: balance; }
.top { max-width: 1280px; margin: 0 auto; padding: 18px 16px 6px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 46px; height: 46px; flex: none; }
.logo .bg { fill: var(--go); }
.logo .fg { fill: var(--on-go); }
.logo .ring { fill: none; stroke: var(--on-go); stroke-width: 1.6; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; line-height: 1.05; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: .95rem; }
.app {
  display: grid;
  grid-template-columns: minmax(290px, 370px) minmax(0, 1fr);
  grid-template-areas: "types preview" "learn preview" "page preview" "tip preview";
  grid-template-rows: auto auto auto 1fr;
  gap: 14px 22px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 16px 40px;
}
.p-types { grid-area: types; }
.p-learn { grid-area: learn; }
.p-page { grid-area: page; }
.p-tip { grid-area: tip; }
.panel { align-self: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ph { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.type-btn { appearance: none; font: inherit; text-align: left; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; cursor: pointer; }
.type-btn:hover { border-color: var(--rule); }
.type-btn[aria-pressed="true"] { border-color: var(--go); background: var(--go-soft); box-shadow: inset 4px 0 0 var(--go); }
.type-btn .tn { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.type-btn .ts { font-size: .8rem; line-height: 1.25; color: var(--muted); }
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lab { font-size: .86rem; font-weight: 700; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { appearance: none; font: inherit; font-size: .92rem; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.seg button:hover { border-color: var(--rule); }
.seg button[aria-pressed="true"] { background: var(--go); border-color: var(--go); color: var(--on-go); }
select, input[type="text"] { width: 100%; min-width: 0; font: inherit; font-size: .95rem; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.check { grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--go); }
.check label { font-size: .95rem; font-weight: 400; color: var(--ink); }
.p-tip { background: var(--go-soft); border-color: transparent; }
.p-tip p { margin: 0; font-size: .95rem; max-width: 65ch; }
.previewCol { grid-area: preview; align-self: start; position: sticky; top: 12px; display: grid; gap: 10px; min-width: 0; }
.pbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pnav { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }
.pnav button { width: 36px; height: 36px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.3rem; line-height: 1; cursor: pointer; }
.pnav button:disabled { opacity: .4; cursor: default; }
.sheetWrap { padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--rule) 16%, var(--paper)); }
.sheet { display: block; width: 100%; height: auto; background: #fff; border-radius: 3px; box-shadow: 0 1px 2px rgba(16, 36, 56, .14), 0 10px 26px rgba(16, 36, 56, .14); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.primary { flex: 1 1 200px; appearance: none; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--go); color: var(--on-go); font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; cursor: pointer; }
.ghost { appearance: none; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.ghost:hover { border-color: var(--rule); }
button:disabled { opacity: .55; cursor: progress; }
.status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: .92rem; }
:focus-visible { outline: 3px solid var(--rule); outline-offset: 2px; }
#printArea { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "types" "learn" "preview" "page" "tip"; grid-template-rows: none; }
  .previewCol { position: static; }
  .types { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .type-btn { flex: 0 0 140px; scroll-snap-align: start; }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  body { padding-bottom: 86px; }
}
@media print {
  body { background: #fff; padding: 0; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
  .print-page { display: block; break-after: page; page-break-after: always; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect class="bg" x="1" y="1" width="38" height="38" rx="11"/>
      <circle class="ring" cx="11" cy="28" r="4.8"/>
      <circle class="fg" cx="11" cy="28" r="2.2"/>
      <circle class="fg" cx="17.5" cy="21.5" r="2"/>
      <circle class="fg" cx="23.5" cy="16.5" r="2"/>
      <circle class="fg" cx="30" cy="13" r="2"/>
    </svg>
    <div>
      <h1>Tuldok</h1>
      <p>Printable worksheets for Nursery, Pre-K and Kinder</p>
    </div>
  </div>
</header>

<main class="app">
  <section class="panel p-types" aria-labelledby="h-types">
    <h2 class="ph" id="h-types">Worksheet</h2>
    <div class="types" id="types" role="group" aria-labelledby="h-types"></div>
  </section>

  <section class="panel p-learn" aria-labelledby="h-learn">
    <h2 class="ph" id="h-learn">Learners and activity</h2>
    <div class="field"><span class="lab" id="lab-age">Age group</span><div class="seg" id="age" role="group" aria-labelledby="lab-age"></div></div>
    <div class="field"><span class="lab" id="lab-lang">Language on the sheet</span><div class="seg" id="lang" role="group" aria-labelledby="lab-lang"></div></div>
    <div class="fields" id="typeOptions"></div>
    <div class="field" id="supportField"><label for="support">Tracing help</label><select id="support"></select></div>
    <div class="field"><span class="lab" id="lab-pic">Pictures</span><div class="seg" id="pic" role="group" aria-labelledby="lab-pic"></div></div>
  </section>

  <section class="previewCol" aria-label="Preview">
    <div class="pbar">
      <div class="pnav">
        <button type="button" id="prev" aria-label="Previous page">&#8249;</button>
        <span id="pageLabel">Page 1 of 1</span>
        <button type="button" id="next" aria-label="Next page">&#8250;</button>
      </div>
      <button type="button" id="shuffle" class="ghost">New version</button>
    </div>
    <div class="sheetWrap"><canvas id="sheet" class="sheet" width="840" height="1188" role="img" aria-label="Worksheet preview"></canvas></div>
    <div class="actions" id="actions">
      <button type="button" id="download" class="primary">Download PDF</button>
      <button type="button" id="print" class="ghost" hidden>Print</button>
      <button type="button" id="share" class="ghost" hidden>Share</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="panel p-page" aria-labelledby="h-page">
    <h2 class="ph" id="h-page">Page setup</h2>
    <div class="field"><label for="paper">Paper size</label><select id="paper"></select></div>
    <div class="field" id="pagesField"><label for="pages">How many pages (each one different)</label><select id="pages"></select></div>
    <div class="field check"><input type="checkbox" id="nameLine"><label for="nameLine">Name and date line</label></div>
    <div class="field"><label for="school">School or teacher name, printed at the bottom</label><input type="text" id="school" maxlength="80" autocomplete="off" placeholder="Teacher Joy, Sampaguita Learning Center"></div>
  </section>

  <aside class="panel p-tip" aria-labelledby="h-tip">
    <h2 class="ph" id="h-tip">Teacher's note</h2>
    <p id="tipText"></p>
  </aside>
</main>
<div id="printArea"></div>
<style id="pageStyle"></style>
<noscript><p style="padding:16px">Tuldok needs JavaScript to draw worksheets.</p></noscript>

const LS_KEY = 'tuldok-worksheets-v1';

let page = 0, raf = 0, lastErr = null;

function loadState() {
  const out = JSON.parse(JSON.stringify(DEFAULTS));
  let s = null;

  if (s && typeof s === 'object') {
    if (TYPES[s.type]) out.type = s.type;
    if (AGES[s.age]) out.age = s.age;
    if (LANGS.some(function (x) { return x[0] === s.lang; })) out.lang = s.lang;
    if (SUPPORT.some(function (x) { return x[0] === s.support; })) out.support = s.support;
    if (s.pic === 'line' || s.pic === 'color') out.pic = s.pic;
    if (PAPERS[s.paper]) out.paper = s.paper;
    const pg = parseInt(s.pages, 10);
    if (pg >= 1 && pg <= 10) out.pages = pg;
    if (typeof s.nameLine === 'boolean') out.nameLine = s.nameLine;
    if (typeof s.school === 'string') out.school = s.school.slice(0, 80);

function saveState() { try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) { /* storage unavailable: settings are not remembered */ } }
function merged(s) {
  const t = TYPES[s.type] || TYPES.letters, cur = (s.opts && s.opts[s.type]) || {}, o = Object.assign({}, s);

}

  TYPES[type].options.forEach(function (op) { if (!op.choices.some(function (c) { return c[0] === cur[op.key]; })) cur[op.key] = op.def; });

}

  let h = '';

/* ================= controls ================= */

  sel.value = String(val);
}
function seg(id, items, getVal, setVal) {

  box.innerHTML = '';

    const b = document.createElement('button');
    b.type = 'button';
    b.id = id + '-' + it[0];
    b.textContent = it[1];
    b.setAttribute('aria-pressed', String(getVal() === it[0]));
    b.addEventListener('click', function () {
      setVal(it[0]);
      box.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      changed();

    box.appendChild(b);

}
function buildTypes() {

  Object.keys(TYPES).forEach(function (k) {
    const t = TYPES[k], b = document.createElement('button');
    b.type = 'button';
    b.className = 'type-btn';
    b.id = 'type-' + k;
    b.setAttribute('aria-pressed', String(st.type === k));
    const nm = document.createElement('span'); nm.className = 'tn'; nm.textContent = t.name;
    const sb = document.createElement('span'); sb.className = 'ts'; sb.textContent = t.sub;

/* ================= preview ================= */
function schedule() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; renderPreview(); }); }
function changed() { saveState(); schedule(); }
function renderPreview() {
  const cv = document.getElementById('sheet'), paper = PAPERS[st.paper] || PAPERS.a4;
  const cssW = Math.max(260, Math.min(cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 600, 1000));
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const pxW = Math.round(cssW * dpr), pxH = Math.round(pxW * paper.h / paper.w);

  const ctx = cv.getContext('2d');
  ctx.setTransform(pxW / paper.w, 0, 0, pxW / paper.w, 0, 0);
  const n = pageCount();
  page = Math.max(0, Math.min(page, n - 1));
  lastErr = null;
  drawPage(ctx, st, page);
  const t = TYPES[st.type];
  document.getElementById('pageLabel').textContent = 'Page ' + (page + 1) + ' of ' + n;
  document.getElementById('prev').disabled = page <= 0;
  document.getElementById('next').disabled = page >= n - 1;
  document.getElementById('pagesField').hidden = !!(t.multipage && t.multipage(merged(st)));

/* ================= export: PDF, print, share ================= */
const EXPORT_DPI = 180;
const framed = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
function hasClaude() { return !!(window.claude && typeof window.claude.use === 'function'); }

function nextTick() { return new Promise(function (res) { setTimeout(res, 0); }); }
function fileName() {
  const o = merged(st), t = TYPES[st.type];
  let d = '';
  if (st.type === 'letters') d = o.letter.indexOf('all') === 0 ? o.letter : 'letter-' + o.letter;
  else if (st.type === 'numbers') d = o.num.indexOf('all') === 0 ? o.num : 'number-' + o.num;

}
function canvasJpeg(cv, q) {
  return new Promise(function (resolve, reject) {
    if (cv.toBlob) {
      cv.toBlob(function (b) {
        if (!b) { reject(new Error('Could not turn a page into an image.')); return; }
        if (b.arrayBuffer) { b.arrayBuffer().then(function (ab) { resolve(new Uint8Array(ab)); }, reject); return; }
        const fr = new FileReader();
        fr.onload = function () { resolve(new Uint8Array(fr.result)); };
        fr.onerror = function () { reject(fr.error); };
        fr.readAsArrayBuffer(b);

/* Minimal PDF writer: one full-page JPEG per page, sized to the chosen paper. */
function makePdf(jpegs, wPx, hPx, wPt, hPt) {

    addObj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ' + ct + ' 0 R >>');

    add(enc(im + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + wPx + ' /Height ' + hPx + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n'));
    add(jpg);

async function buildPdf(progress) {
  const paper = PAPERS[st.paper] || PAPERS.a4, pxPerMm = EXPORT_DPI / 25.4;
  const cw = Math.round(paper.w * pxPerMm), ch = Math.round(paper.h * pxPerMm);

  cv.height = ch;
  const ctx = cv.getContext('2d'), n = pageCount(), jpegs = [];

      if (!dl) { status('Saving files is switched off in this view. Open this page in claude.ai to download PDFs.'); return; }
      try {
        await dl.save({ filename: name, data: blob });
        status('Saved ' + name + '. Print at 100% (Actual size) so the letters keep their size.');
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') status('Download cancelled.');
        else if (code === 'rate_limited') status('A save prompt is already open. Finish it, then try again.');
        else status('Could not save the PDF (' + (code || (e && e.message) || 'unknown error') + ').');
      }
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      status('Downloaded ' + name + '. Print at 100% (Actual size) so the letters keep their size.');
    }
  } catch (e) {
    status('Could not make the PDF: ' + ((e && e.message) || e));
  } finally {
    setBusy(false);
  }
}
async function onPrint() {
  setBusy(true);
  try {
    if (androidBridge()) {
      const pdf = await buildPdf(function (i, n) { status('Making page ' + i + ' of ' + n + '…'); });
      await sendToAndroid(pdf, fileName(), 'print');
      return;
    }
    const paper = PAPERS[st.paper] || PAPERS.a4, pxPerMm = EXPORT_DPI / 25.4;
    const cv = document.createElement('canvas');
    cv.width = Math.round(paper.w * pxPerMm);
    cv.height = Math.round(paper.h * pxPerMm);
    const ctx = cv.getContext('2d'), area = document.getElementById('printArea'), n = pageCount();
    area.innerHTML = '';
    for (let i = 0; i < n; i++) {
      ctx.setTransform(pxPerMm, 0, 0, pxPerMm, 0, 0);
      drawPage(ctx, st, i);
      const img = new Image();
      img.className = 'print-page';
      img.alt = '';
      img.style.width = paper.w + 'mm';
      img.style.height = paper.h + 'mm';
      img.src = cv.toDataURL('image/jpeg', 0.92);
      area.appendChild(img);
      status('Preparing page ' + (i + 1) + ' of ' + n + '…');
      await nextTick();
    }
    document.getElementById('pageStyle').textContent = '@page { size: ' + paper.w + 'mm ' + paper.h + 'mm; margin: 0; }';
    await Promise.all(Array.prototype.map.call(area.querySelectorAll('img'), function (im) { return im.decode ? im.decode().catch(function () { return null; }) : null; }));
    status('');
    window.print();
  } catch (e) {
    status(androidBridge() ? 'Could not print: ' + ((e && e.message) || e) : 'Printing is not available here. Use Download PDF instead.');
  } finally {
    setBusy(false);
  }
}
async function onShare() {
  setBusy(true);
  try {
    const blob = await buildPdf(function (i, n) { status('Making page ' + i + ' of ' + n + '…'); });
    if (androidBridge()) { await sendToAndroid(blob, fileName(), 'share'); return; }
    const file = new File([blob], fileName(), { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Worksheet' });
      status('Shared.');
    } else {
      status('This device cannot share files. Use Download PDF instead.');
    }
  } catch (e) {
    if (e && e.name === 'AbortError') status('');
    else status('Could not share: ' + ((e && e.message) || e));
  } finally {
    setBusy(false);
  }
}
/* ---- Android app bridge: the APK injects window.TuldokAndroid (begin / append / done) ---- */
function androidBridge() { return window.TuldokAndroid || null; }
function blobToBase64(b) {
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    fr.onload = function () { const s = String(fr.result); resolve(s.slice(s.indexOf(',') + 1)); };
    fr.onerror = function () { reject(fr.error); };
    fr.readAsDataURL(b);
  });
}
async function sendToAndroid(blob, name, action) {
  const bridge = androidBridge();
  if (!bridge.begin(name)) throw new Error('The app could not start the file.');
  const CHUNK = 3 * 131072; /* a multiple of 3 bytes, so every piece is complete base64 */
  for (let off = 0; off < blob.size; off += CHUNK) {
    const b64 = await blobToBase64(blob.slice(off, off + CHUNK));
    if (!bridge.append(b64)) throw new Error('The app could not write the file.');
    status('Handing the PDF to the app… ' + Math.min(100, Math.round(((off + CHUNK) / blob.size) * 100)) + '%');
  }
  bridge.done(action + '|' + st.paper);
}
window.__tuldokNotify = function (msg) { status(String(msg || '')); };

function setupExportButtons() {
  if (androidBridge()) {
    document.getElementById('download').textContent = 'Save PDF';
    document.getElementById('print').hidden = false;
    document.getElementById('share').hidden = false;
    return;
  }
  if (!framed && !hasClaude()) {
    document.getElementById('print').hidden = false;
    if (navigator.canShare && navigator.share && window.File) document.getElementById('share').hidden = false;
  }
  if (hasClaude()) {
    window.claude.use('downloads').then(function (ns) {
      if (!ns) {
        document.getElementById('download').hidden = true;
        status('Saving files is switched off in this view. Open this page in claude.ai to download PDFs.');
      }
    }, function () { /* leave the button; the click explains any problem */ });
  }
}

/* ================= start ================= */
function init() {
  const fromHash = typeFromHash();
  if (fromHash) st.type = fromHash;
  typeOpts(st.type);
  buildTypes();
  seg('age', Object.keys(AGES).map(function (k) { return [k, AGES[k].label]; }), function () { return st.age; }, function (v) { st.age = v; page = 0; });
  seg('lang', LANGS, function () { return st.lang; }, function (v) { st.lang = v; });
  seg('pic', PICS, function () { return st.pic; }, function (v) { st.pic = v; });
  const sup = document.getElementById('support');
  fillSelect(sup, SUPPORT, st.support);
  sup.addEventListener('change', function () { st.support = sup.value; changed(); });
  const pap = document.getElementById('paper');
  fillSelect(pap, Object.keys(PAPERS).map(function (k) { return [k, PAPERS[k].label]; }), st.paper);
  pap.addEventListener('change', function () { st.paper = pap.value; changed(); });
  const pgs = document.getElementById('pages');
  fillSelect(pgs, Array.from({ length: 10 }, function (_, i) { return [String(i + 1), String(i + 1)]; }), st.pages);
  pgs.addEventListener('change', function () { st.pages = parseInt(pgs.value, 10) || 1; page = 0; changed(); });
  const nl = document.getElementById('nameLine');
  nl.checked = st.nameLine;
  nl.addEventListener('change', function () { st.nameLine = nl.checked; changed(); });
  const sc = document.getElementById('school');
  let tmr = 0;
  sc.value = st.school;
  sc.addEventListener('input', function () { st.school = sc.value.slice(0, 80); clearTimeout(tmr); tmr = setTimeout(changed, 200); });
  document.getElementById('prev').addEventListener('click', function () { if (page > 0) { page--; schedule(); } });
  document.getElementById('next').addEventListener('click', function () { if (page < pageCount() - 1) { page++; schedule(); } });
  document.getElementById('shuffle').addEventListener('click', function () { st.seed = (st.seed + 1) % 100000; changed(); });
  document.getElementById('download').addEventListener('click', onDownload);
  document.getElementById('print').addEventListener('click', onPrint);
  document.getElementById('share').addEventListener('click', onShare);
  buildTypeOptions();
  setupExportButtons();
  window.addEventListener('hashchange', function () { const k = typeFromHash(); if (k && k !== st.type) setType(k, true); });
  if (window.ResizeObserver) new ResizeObserver(function () { schedule(); }).observe(document.querySelector('.sheetWrap'));
  else window.addEventListener('resize', schedule);
  renderPreview();
  if (document.fonts && document.fonts.load) {
    Promise.all(['600 20px "Fredoka"', '400 20px "Andika"', '700 20px "Andika"', 'italic 400 20px "Andika"'].map(function (f) {
      return document.fonts.load(f).catch(function () { return null; });
    })).then(function () { schedule(); });
  }
}
init();

})();
